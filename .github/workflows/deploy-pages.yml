name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: 'Check Pages site is enabled'
        id: configure
        uses: actions/configure-pages@v5
      - name: Build with preview base path
        run: npx astro build
        env:
          SITE_BASE: /using-it-website
      - name: Rewrite root-absolute URLs to the project path
        run: |
          find dist -name '*.html' -print0 |
          xargs -0 perl -pi -e 's{(href|src)="/((?!using-it-website/|/)[^"]*)}{$1="/using-it-website/$2}g'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  report-deploy-failure:
    needs: deploy
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: 'Report deploy failure with log tail'
        uses: actions/github-script@v7
        with:
          script: |
            const { data: run } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failed = run.jobs.filter(j => j.conclusion === 'failure');
            const logs = [];
            for (const j of failed) {
              const res = await github.request('GET ' + j.url + '/logs');
              const text = typeof res.data === 'string' ? res.data : JSON.stringify(res.data);
              const tail = text.split('\n').slice(-60).join('\n');
              logs.push('## ' + j.name + '\n\n```\n' + tail + '\n```');
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Pages deploy failure on main',
              body: 'Deploy to GitHub Pages failed. Log tails:\n\n' + logs.join('\n\n'),
            });