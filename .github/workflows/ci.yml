name: CI — build & check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Build
        run: npm run build 2>&1 | tee build.log
      - name: Check internal links
        if: success()
        run: |
          python3 - <<'EOF'
          import re, pathlib, sys
          errors = []
          for f in pathlib.Path('dist').rglob('*.html'):
              for m in re.finditer(r'href="(/[^"#]*?)(/)"', f.read_text()):
                  target = m.group(1)
                  ok = (pathlib.Path('dist') / target.lstrip('/')).exists() \
                       or (pathlib.Path('dist') / (target.lstrip('/') + '/index.html')).exists() \
                       or target in ('/rss.xml', '/sitemap-index.xml', '/robots.txt')
                  if not ok:
                      errors.append(f'{f}: broken internal link {target}')
          for e in errors[:20]: print(e)
          sys.exit(1 if errors else 0)
          EOF
      - name: Upload build artifact
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 14

  report-failure:
    needs: build
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Create issue with build failure
        uses: actions/github-script@v7
        with:
          script: |
            const { data: run } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            const failed = run.jobs.filter(j => j.conclusion === 'failure');
            const logs = [];
            for (const j of failed) {
              const { data } = await github.rest.actions.getJobLogs({
                owner: context.repo.owner,
                repo: context.repo.repo,
                job_id: j.id,
              });
              const tail = data.split('\n').slice(-80).join('\n');
              logs.push(`## ${j.name}\n\n\`\`\`\n${tail}\n\`\`\``);
            }
            // close previous open build-failure issues (only our own reports,
            // never unrelated feature/bug issues)
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open',
            });
            for (const i of issues) {
              if (!i.title.startsWith('Build failure on main')) continue;
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failure on main (${context.sha.slice(0, 7)})`,
              body: `Automatic report from CI run ${context.runId}.\n\n${logs.join('\n\n')}`,
            });
  close-stale-failure-issues:
    needs: build
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close resolved build-failure reports
        uses: actions/github-script@v7
        with:
          script: |
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open',
            });
            for (const i of issues) {
              if (!i.title.startsWith('Build failure on main')) continue;
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number,
                body: `Build on main is green again (run ${context.runId}, ${context.sha.slice(0, 7)}). Closing this stale failure report.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: i.number, state: 'closed',
              });
            }
